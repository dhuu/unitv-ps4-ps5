name: Build PS5 ELF

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # ps5-payload-sdk + bibliotecas (SDL2, FFmpeg, FreeType, curl) do PacBrew
      PACBREW_VERSION: v0.41.1
      # https://github.com/ps5-payload-dev/websrv (código-fonte do binário embutido)
      WEBSRV_VERSION: v0.34

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar clang/lld 18 e ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 cmake make pkg-config python3

      - name: Cache do SDK do PS5
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ps5-payload-dev.tar.gz
          key: ps5-payload-dev-${{ env.PACBREW_VERSION }}

      - name: Baixar SDK do PS5
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: curl -sL -o ps5-payload-dev.tar.gz "https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/${PACBREW_VERSION}/ps5-payload-dev.tar.gz"

      - name: Instalar SDK do PS5 em /opt/ps5-payload-sdk
        run: |
          sudo tar xf ps5-payload-dev.tar.gz -C /
          ls /opt/ps5-payload-sdk/bin

      # Etapa 1: o app em si. É ele que roda na tela (gravado em /data/WillProTV/eboot.elf)
      - name: Compilar app (eboot.elf)
        run: |
          /opt/ps5-payload-sdk/bin/prospero-cmake -S . -B build-app
          cmake --build build-app -j"$(nproc)"

      - name: Mapa de símbolos (para traduzir endereços de crash do log)
        run: llvm-nm-18 -n -C build-app/WillProTV-PS5.elf > build-app/WillProTV-PS5.map

      # Etapa 2: o .elf que se envia ao PS5. Leva o app (assets/app) e o websrv (assets/websrv);
      # enviado como payload, grava os arquivos em /data/WillProTV, sobe o websrv e abre o app.
      - name: Embutir app e websrv (ps5-payload-dev, GPLv3)
        run: |
          mkdir -p assets/app assets/websrv
          cp build-app/WillProTV-PS5.elf assets/app/eboot.elf
          cp sce_sys/icon0.png assets/app/icon0.png
          curl -sfL -o assets/websrv/websrv-ps5.elf \
            "https://github.com/ps5-payload-dev/websrv/releases/download/${WEBSRV_VERSION}/websrv-ps5.elf"
          ls -l assets/app assets/websrv

      - name: Compilar ELF final
        run: |
          /opt/ps5-payload-sdk/bin/prospero-cmake -S . -B build-ps5
          cmake --build build-ps5 -j"$(nproc)"
          cp build-app/WillProTV-PS5.map build-ps5/WillProTV-PS5.map
          ls -l build-ps5/WillProTV-PS5.elf

      - name: Enviar ELF (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WillProTV-PS5-elf
          path: |
            build-ps5/WillProTV-PS5.elf
            build-ps5/WillProTV-PS5.map
          if-no-files-found: error

      # Opcional: pasta no formato do Launcher do websrv (/data/homebrew/WillProTV)
      - name: Montar pasta homebrew
        run: |
          mkdir -p homebrew/WillProTV/sce_sys
          cp build-app/WillProTV-PS5.elf homebrew/WillProTV/eboot.elf
          cp sce_sys/icon0.png homebrew/WillProTV/sce_sys/icon0.png
          (cd homebrew && zip -r ../WillProTV-PS5-homebrew.zip WillProTV)

      - name: Enviar pasta homebrew (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WillProTV-PS5-homebrew
          path: homebrew
          if-no-files-found: error

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-ps5/WillProTV-PS5.elf
            WillProTV-PS5-homebrew.zip
